name: Sync API Spec

on:
    repository_dispatch:
        types: [api-release]
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version bump type'
                required: false
                default: 'patch'
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: write
    packages: write
    id-token: write

jobs:
    sync:
        name: Sync and Publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::013292575751:role/github-action-role
                  aws-region: us-east-2

            - name: Download internal spec from S3
              run: |
                  mkdir -p specs
                  aws s3 cp s3://augno-private-openapi-specs/openapi.json specs/internal_openapi_spec.json

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://npm.pkg.github.com/

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install

            - name: Generate types
              run: bun run generate

            - name: Check for changes
              id: diff
              run: |
                  if git diff --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "No changes after regenerating — skipping."
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                    echo "Changes detected:"
                    git diff --stat
                  fi

            - name: Type check
              if: steps.diff.outputs.changed == 'true'
              run: bun run check-types

            - name: Determine bump type
              if: steps.diff.outputs.changed == 'true'
              id: bump
              run: |
                  echo "type=${{ github.event.inputs.bump || 'patch' }}" >> "$GITHUB_OUTPUT"

            - name: Create changeset
              if: steps.diff.outputs.changed == 'true'
              run: |
                  mkdir -p .changeset
                  BUMP="${{ steps.bump.outputs.type }}"
                  API_VERSION="${{ github.event.client_payload.api_version || 'manual' }}"
                  cat > .changeset/sync-api-spec.md << EOF
                  ---
                  '@augno/internal-sdk': ${BUMP}
                  ---

                  Sync types from API ${API_VERSION}
                  EOF

            - name: Version packages
              if: steps.diff.outputs.changed == 'true'
              run: bunx changeset version

            - name: Publish to GitHub Packages
              if: steps.diff.outputs.changed == 'true'
              run: npm run release
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit and push
              if: steps.diff.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  API_VERSION="${{ github.event.client_payload.api_version || 'manual' }}"
                  git commit -m "chore: sync types from API ${API_VERSION}"
                  git push
